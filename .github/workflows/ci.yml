name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The 30 MB release is not downloaded here. Validation is exercised
      # against synthetic files with the real column layout; the tests that
      # assert published counts are marked `realdata` and skip themselves.
      - name: Test
        run: pytest -v -m "not realdata"

  verify-against-upstream:
    # The synthetic tests prove the loader is correct; this job proves the
    # upstream release still says what the analysis claims it says. Split out
    # so a change at the source is distinguishable from a bug here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Fetch CHCD v3.0.1
        run: python scripts/fetch_data.py --checksums

      - name: Verify published counts
        run: pytest -v -m realdata
